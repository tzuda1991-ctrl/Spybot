plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.spybot'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.spybot"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        
        // Default fallback values (agar settings me kuch na ho to ye use honge)
        buildConfigField "String", "DEFAULT_BOT_TOKEN", "\"YOUR_BOT_TOKEN_HERE\""
        buildConfigField "String", "DEFAULT_CHAT_ID", "\"YOUR_CHAT_ID_HERE\""
        
        vectorDrawables.useSupportLibrary = true
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    
    // 🔴 NEW: For In-App Settings
    implementation 'androidx.preference:preference-ktx:1.2.1'
}
